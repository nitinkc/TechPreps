site_name: "TechPreps — Interview Prep"
repo_name: "TechPreps"
repo_url: "https://github.com/nitinkc/TechPreps"
site_description: "Technical interview preparation: algorithms, system design, and microservices patterns."
docs_dir: "docs"
site_dir: "site"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Algorithms:
    - Overview: algo/coding_questions.md
    - Shortest Path: algo/01_shortest_path_weighted_graph.md
    - LRU Cache: algo/02_lru_cache.md
    - Reverse Linked List: algo/03_reverse_linked_list.md
    - Batch Reconciliation: algo/04_batch_processing_reconciliation.md
    - Subarray Product: algo/05_subarray_product_less_than_k.md
    - Min Machines: algo/06_min_machines_for_tasks.md
    - Connect Sticks: algo/07_min_cost_connect_sticks.md
    - Task Scheduler: algo/08_task_dependency_scheduler.md
    - Number of Islands: algo/09_number_of_islands.md
    - Combination Sum: algo/10_combination_sum.md
    - Level Order Traversal: algo/11_binary_tree_level_order.md
    - Islands Analysis: algo/12_islands_examples_analysis.md
    - LRU & BFS vs DFS: algo/13_lru_data_structure_and_bfs_vs_dfs.md
    - 90th Percentile: algo/14_ninetieth_percentile_api_response.md
    - Poles Sequence: algo/15_poles_sequence_x_2x_4x.md
  - System Design:
    - Overview: system_design/system_design.md
    - API Performance: system_design/api_performance_microservices.md
    - Caching: system_design/caching.md
    - Circuit Breaker: system_design/circuit_breaker.md
    - Data Ingestion: system_design/data_ingestion.md
    - Database Design: system_design/database_design.md
    - Error Handling: system_design/error_handling_debugging.md
    - Messaging: system_design/messaging_kafka_nats_eventhub.md
    - Microservices Scaling: system_design/microservices_scaling.md
    - Performance: system_design/performance_optimization.md
    - Saga Pattern: system_design/saga_pattern.md
    - Security: system_design/security.md
    - Service Discovery: system_design/service_discovery.md
    - Terraform: system_design/terraform.md
